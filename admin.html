<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Cat Hub</title><link rel="stylesheet" href="/ui/style.css"></head><body data-page="admin" data-auth="required" data-admin="required"><div class="shell" data-shell><main class="main"><header class="topbar"><div><div class="eyebrow">CONTROL CENTER</div><h1 class="title">Admin</h1><p class="sub">admin.txtに登録された管理者専用ページです。</p></div><button class="btn ghost mobile" data-menu>☰</button></header><div class="content-panel"><p data-auth-message aria-live="polite">管理者権限を確認中…</p></div><section class="grid" data-admin-content><div class="card"><div class="metric">Firebase</div><p>アカウント認証</p></div><div class="card"><div class="metric">admin.txt</div><p>管理者判定元</p></div><div class="card"><div class="metric" data-uptime>--</div><p>サーバー稼働時間</p></div><div class="card full"><h3>サービス状態</h3><div class="list" data-services style="margin-top:15px"></div></div></section></main></div><script src="/ui/app.js"></script><script type="module" src="/ui/auth.js"></script><script>document.addEventListener('catHubAdminReady',event=>{document.querySelector('[data-auth-message]').textContent='管理者として認証されました。';document.querySelector('[data-auth-message]').style.color='var(--green)';document.querySelector('[data-uptime]').textContent=Math.floor(event.detail.uptimeSeconds/60)+'分';document.querySelector('[data-services]').innerHTML=event.detail.services.map(name=>'<div class="list-item">'+name+' <span class="status"><i class="dot"></i>正常</span></div>').join('')})</script></body></html>
