<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cat Hub - ホーム</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="ch-mobile-topbar">
    <button id="ch-mobile-toggle" type="button">メニュー</button>
    <strong>Cat Hub</strong>
    <span></span>
  </div>
  <div class="ch-layout">
    <nav class="ch-nav" id="ch-nav-root"></nav>
    <main class="ch-main">
      <h1 class="ch-page-title">ホーム</h1>
      <p class="ch-page-sub">Cat Hubへようこそ。左のメニューから各機能を利用できます。</p>

      <div class="ch-grid">
        <div class="ch-tile">
          <h3>Cat Tube</h3>
          <p>YouTube動画の検索・視聴ができます。</p>
          <a class="ch-btn secondary" href="/cattube.html">開く</a>
        </div>
        <div class="ch-tile">
          <h3>Cloud Cat</h3>
          <p>フレンド・DM・グループ・コミュニティでのチャット。</p>
          <a class="ch-btn secondary" href="/cloudcat.html">開く</a>
        </div>
        <div class="ch-tile">
          <h3>Play Cat</h3>
          <p>ブラウザゲームを検索・プレイ・評価できます。</p>
          <a class="ch-btn secondary" href="/playcat.html">開く</a>
        </div>
        <div class="ch-tile">
          <h3>Proxy</h3>
          <p>許可されたホストへの安全なWebアクセス機能。</p>
          <a class="ch-btn secondary" href="/proxy.html">開く</a>
        </div>
        <div class="ch-tile">
          <h3>Web VM</h3>
          <p>ブラウザ内で動作する仮想マシンからWebを閲覧。</p>
          <a class="ch-btn secondary" href="/webvm.html">開く</a>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/nav.js"></script>
</body>
</html>
