<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxy | Cat Hub</title><link rel="stylesheet" href="/ui/style.css"></head><body data-page="proxy"><div class="shell" data-shell><main class="main"><header class="topbar"><div><div class="eyebrow">SERVICE ROUTING</div><h1 class="title">Reverse Proxy</h1><p class="sub">Cat Hub内サービスの公開経路と状態を管理します。</p></div><button class="btn ghost mobile" data-menu>☰</button></header><section class="grid"><div class="card"><span class="status"><i class="dot"></i>稼働中</span><div class="metric">5</div><p>登録サービス</p></div><div class="card"><span class="status"><i class="dot"></i>正常</span><div class="metric">24ms</div><p>平均応答時間</p></div><div class="card"><span class="status"><i class="dot"></i>保護中</span><div class="metric">TLS</div><p>HTTPS接続</p></div></section><h2 class="section-title">ルート</h2><div class="content-panel"><div class="list"><div class="list-item active"><b>/tube</b> → cattube:3001　<span class="status"><i class="dot"></i>Online</span></div><div class="list-item"><b>/cloud</b> → cloudcat:3002　<span class="status"><i class="dot"></i>Online</span></div><div class="list-item"><b>/play</b> → playcat:3003　<span class="status"><i class="dot"></i>Online</span></div></div><button class="btn" style="margin-top:18px" data-demo="ルート追加フォームはバックエンド実装時に接続します">＋ ルートを追加</button></div></main></div><script src="/ui/app.js"></script></body></html>
