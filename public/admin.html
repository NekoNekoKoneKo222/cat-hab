<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cat Hub - Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-require-auth="true" data-require-admin="true">
  <div class="ch-mobile-topbar">
    <button id="ch-mobile-toggle" type="button">メニュー</button>
    <strong>Cat Hub</strong>
    <span></span>
  </div>
  <div class="ch-layout">
    <nav class="ch-nav" id="ch-nav-root"></nav>
    <main class="ch-main">
      <h1 class="ch-page-title">Admin</h1>
      <p class="ch-page-sub">システム設定の確認ができます。秘密情報（APIキー等の値）はここには表示されません。</p>

      <div class="ch-card">
        <h3 style="margin-top:0; color:var(--ch-purple-dark);">Web VM 設定</h3>
        <div id="vm-settings">読み込み中...</div>
      </div>

      <div class="ch-card">
        <h3 style="margin-top:0; color:var(--ch-purple-dark);">Proxy 設定</h3>
        <div id="proxy-settings">読み込み中...</div>
      </div>

      <div class="ch-card">
        <h3 style="margin-top:0; color:var(--ch-purple-dark);">Cat Tube 設定</h3>
        <div id="youtube-settings">読み込み中...</div>
      </div>
    </main>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
