<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cat Hub - 診断ページ</title>
<style>
  body { font-family: monospace; background: #1a1024; color: #e6e0f8; padding: 20px; }
  button { background: #7b52c7; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; margin: 6px 6px 6px 0; cursor: pointer; }
  input { padding: 8px; font-size: 16px; margin: 4px 0; width: 100%; max-width: 300px; box-sizing: border-box; }
  pre { background: #2e1a52; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #7fe0a8; }
  .ng { color: #ff8fa3; }
  h2 { color: #d9cdf2; margin-top: 24px; }
</style>
</head>
<body>
  <h1>Cat Hub 診断ページ</h1>
  <p>このページはデバッグ用です。各ボタンを押すと、実際に何が起きたかがそのまま下に表示されます。表示された内容をそのままコピーして共有してください。</p>

  <h2>1. サーバー疎通</h2>
  <button id="btn-health">healthzを確認</button>
  <pre id="out-health">(未実行)</pre>

  <h2>2. 新規登録テスト(既存ユーザー名だと失敗するので毎回ランダムな名前で試します)</h2>
  <button id="btn-register">テスト用ユーザーで登録してみる</button>
  <pre id="out-register">(未実行)</pre>

  <h2>3. ログイン状態確認</h2>
  <button id="btn-me">/api/auth/me を確認</button>
  <pre id="out-me">(未実行)</pre>

  <h2>4. 実際のログインテスト</h2>
  <input id="username" placeholder="ユーザー名" />
  <input id="password" placeholder="パスワード" type="password" />
  <br />
  <button id="btn-login">ログインしてみる</button>
  <pre id="out-login">(未実行)</pre>

  <h2>5. Cookie確認</h2>
  <button id="btn-cookie">現在のCookieを表示</button>
  <pre id="out-cookie">(未実行)</pre>

  <script src="/js/debug.js"></script>
</body>
</html>
