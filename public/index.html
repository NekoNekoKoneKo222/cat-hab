<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Hub</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="brand-mark">Cat Hub</div>
    <p class="muted">Cat Tube / Cloud Cat / Play Cat</p>
    <div class="auth-tabs">
      <button id="loginTab" class="tab active" type="button">ログイン</button>
      <button id="signupTab" class="tab" type="button">新規登録</button>
    </div>
    <form id="authForm" class="stack">
      <input id="username" class="input" placeholder="ユーザー名" autocomplete="username" required>
      <input id="displayName" class="input hidden" placeholder="表示名" autocomplete="name">
      <input id="password" class="input" type="password" placeholder="パスワード（8文字以上）" autocomplete="current-password" required>
      <label id="termsRow" class="check hidden"><input id="terms" type="checkbox"> 利用規約に同意する</label>
      <button id="authButton" class="btn" type="submit">ログイン</button>
    </form>
    <div id="authError" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Cat Hub</div>
    <button class="nav active" data-panel="tube" type="button">Cat Tube</button>
    <button class="nav" data-panel="cloud" type="button">Cloud Cat</button>
    <button class="nav" data-panel="friends" type="button">フレンド</button>
    <button class="nav" data-panel="rooms" type="button">ルーム</button>
    <button class="nav" data-panel="play" type="button">Play Cat</button>
    <button id="adminNav" class="nav hidden" data-panel="admin" type="button">管理</button>
    <button class="nav" data-panel="settings" type="button">設定</button>
    <div class="sidebar-bottom">
      <div id="meName"></div>
      <button id="logout" class="nav" type="button">ログアウト</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <strong id="pageTitle">Cat Tube</strong>
      <span id="status" class="muted"></span>
    </header>

    <div class="content">
      <section id="tube" class="panel">
        <div class="toolbar">
          <input id="tubeSearch" class="input" placeholder="YouTubeを検索">
          <button id="tubeSearchBtn" class="btn" type="button">検索</button>
        </div>
        <div id="tubeResults" class="grid"></div>
      </section>

      <section id="cloud" class="panel hidden">
        <div class="chat-layout">
          <div class="panel mini-panel">
            <div class="row-between"><h3>DM</h3><button id="refreshDM" class="btn alt small-btn" type="button">更新</button></div>
            <div id="dmList" class="list"></div>
          </div>
          <div class="panel chat-panel">
            <div id="dmMessages" class="messages"><div class="muted">フレンドからDMを開いてください</div></div>
            <form id="dmForm" class="composer hidden">
              <input id="dmInput" class="input" placeholder="メッセージ" autocomplete="off">
              <input id="dmImage" type="file" accept="image/*" hidden>
              <label for="dmImage" class="btn alt">画像</label>
              <button class="btn" type="submit">送信</button>
            </form>
          </div>
        </div>
      </section>

      <section id="friends" class="panel hidden">
        <div class="toolbar">
          <input id="userSearch" class="input" placeholder="ユーザー名・表示名で検索">
          <button id="userSearchBtn" class="btn" type="button">検索</button>
        </div>
        <h3>検索結果</h3>
        <div id="userResults" class="list"></div>
        <h3>フレンド</h3>
        <div id="friendList" class="list"></div>
      </section>

      <section id="rooms" class="panel hidden">
        <div class="room-create cardish">
          <h3>ルーム作成</h3>
          <input id="roomName" class="input" placeholder="ルーム名">
          <div class="checks">
            <label class="check"><input id="privateRoom" type="checkbox"> プライベートルーム</label>
            <label class="check"><input id="requireCode" type="checkbox" disabled> 参加コードを必須にする</label>
          </div>
          <input id="joinCode" class="input" placeholder="参加コード（4〜32文字）">
          <button id="roomCreate" class="btn" type="button">ルームを作成</button>
        </div>
        <h3>公開ルーム</h3>
        <div id="publicRooms" class="list"></div>
        <h3>参加中のルーム</h3>
        <div id="myRooms" class="list"></div>

        <div id="roomView" class="room-view hidden">
          <div class="room-header row-between">
            <div><h3 id="roomTitle">ルーム</h3><span id="roomMeta" class="muted"></span></div>
            <div class="row">
              <button id="refreshRoom" class="btn alt small-btn" type="button">更新</button>
              <button id="deleteRoom" class="btn danger small-btn hidden" type="button">ルーム削除</button>
            </div>
          </div>
          <div class="room-grid">
            <div class="panel chat-panel">
              <div id="roomMessages" class="messages"></div>
              <form id="roomForm" class="composer">
                <input id="roomInput" class="input" placeholder="ルームにメッセージを送信" autocomplete="off">
                <input id="roomImage" type="file" accept="image/*" hidden>
                <label for="roomImage" class="btn alt">画像</label>
                <button class="btn" type="submit">送信</button>
              </form>
            </div>
            <div class="panel members-panel">
              <h3>メンバー</h3>
              <div id="roomMembers" class="list"></div>
              <h3>BAN一覧</h3>
              <div id="roomBans" class="list"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="play" class="panel hidden">
        <h2>Play Cat</h2>
        <div id="games" class="grid"></div>
      </section>

      <section id="admin" class="panel hidden">
        <h2>管理</h2>
        <div id="adminArea" class="list"><div class="muted">Admin専用です。</div></div>
      </section>

      <section id="settings" class="panel hidden">
        <h2>設定</h2>
        <form id="profileForm" class="stack">
          <input id="profileName" class="input" placeholder="表示名">
          <textarea id="profileBio" class="input" rows="4" placeholder="自己紹介"></textarea>
          <button class="btn" type="submit">プロフィール保存</button>
        </form>
        <hr>
        <form id="passwordForm" class="stack">
          <input id="newPassword" class="input" type="password" placeholder="新しいパスワード">
          <button class="btn" type="submit">パスワード変更</button>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
