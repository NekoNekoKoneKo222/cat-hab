<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cat Hub - ログイン</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="ch-auth-wrap">
    <div class="ch-auth-card">
      <h1>Cat Hub にログイン</h1>
      <div id="ch-alert"></div>
      <form class="ch-form" id="login-form">
        <div class="ch-field">
          <label for="username">ユーザー名</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="ch-field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="ch-btn" type="submit">ログイン</button>
      </form>
      <p style="text-align:center; margin-top:16px; font-size:0.88rem; color:var(--ch-text-muted);">
        アカウントをお持ちでない場合は <a href="/register.html">新規登録</a>
      </p>
    </div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('ch-alert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const body = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      };
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        alertBox.innerHTML = '<div class="ch-alert error">' + (data.error || 'ログインに失敗しました') + '</div>';
        return;
      }
      window.location.href = '/';
    });
  </script>
</body>
</html>
