<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cat Hub - プロフィール</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-require-auth="true">
  <div class="ch-mobile-topbar">
    <button id="ch-mobile-toggle" type="button">メニュー</button>
    <strong>Cat Hub</strong>
    <span></span>
  </div>
  <div class="ch-layout">
    <nav class="ch-nav" id="ch-nav-root"></nav>
    <main class="ch-main">
      <h1 class="ch-page-title">プロフィール</h1>
      <p class="ch-page-sub">アカウント情報を確認できます。</p>
      <div class="ch-card" id="profile-card">読み込み中...</div>
    </main>
  </div>
  <script src="/js/nav.js"></script>
  <script>
    document.addEventListener('cathub:user-loaded', (e) => {
      const user = e.detail.user;
      const card = document.getElementById('profile-card');
      if (!user) return;
      card.innerHTML =
        '<p><strong>ユーザー名:</strong> ' + CatHub.escapeHtml(user.username) + '</p>' +
        '<p><strong>表示名:</strong> ' + CatHub.escapeHtml(user.displayName) + '</p>' +
        '<p><strong>権限:</strong> ' + (user.isAdmin ? '管理者' : '一般ユーザー') + '</p>';
    });
  </script>
</body>
</html>
