<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cat Hub - Proxy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-require-auth="true">
  <div class="ch-mobile-topbar">
    <button id="ch-mobile-toggle" type="button">メニュー</button>
    <strong>Cat Hub</strong><span></span>
  </div>
  <div class="ch-layout">
    <nav class="ch-nav" id="ch-nav-root"></nav>
    <main class="ch-main">
      <h1 class="ch-page-title">Proxy</h1>
      <p class="ch-page-sub">管理者が許可したホストへ安全にアクセスできます。スクリプトは実行されません(読み取り専用表示)。</p>

      <div class="ch-card">
        <form class="ch-form" id="proxy-form" style="max-width:none; flex-direction:row; gap:10px; align-items:flex-end;">
          <div class="ch-field" style="flex:1;">
            <label for="target-url">URL</label>
            <input id="target-url" type="text" placeholder="https://example.com/" required />
          </div>
          <button class="ch-btn" type="submit">アクセス</button>
        </form>
        <div id="proxy-alert" style="margin-top:10px;"></div>
      </div>

      <div class="ch-card" id="proxy-frame-card" style="display:none; padding:0; overflow:hidden;">
        <iframe
          id="proxy-frame"
          title="Proxy表示"
          sandbox="allow-forms allow-popups"
          style="width:100%; height:70vh; border:0; display:block; background:#fff;"
        ></iframe>
      </div>
    </main>
  </div>
  <script src="/js/nav.js"></script>
  <script>
    const form = document.getElementById('proxy-form');
    const alertBox = document.getElementById('proxy-alert');
    const frameCard = document.getElementById('proxy-frame-card');
    const frame = document.getElementById('proxy-frame');

    function loadUrl(url) {
      alertBox.innerHTML = '';
      frameCard.style.display = 'none';
      const proxied = '/api/proxy?url=' + encodeURIComponent(url);

      fetch(proxied, { credentials: 'same-origin' })
        .then(async (res) => {
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || ('取得に失敗しました (HTTP ' + res.status + ')'));
          }
          frame.src = proxied;
          frameCard.style.display = 'block';
        })
        .catch((err) => {
          alertBox.innerHTML = '<div class="ch-alert error">' + CatHub.escapeHtml(err.message) + '</div>';
        });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const url = document.getElementById('target-url').value.trim();
      if (!url) return;
      loadUrl(url);
    });
  </script>
</body>
</html>
