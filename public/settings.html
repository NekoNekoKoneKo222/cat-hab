<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/ui/style.css"><title>設定 | Cat Hub</title><body data-page="settings" data-auth="required"><div class="shell" data-shell><main class="main"><h1>設定</h1><section class="content-panel"><h2>プロフィール</h2><form id="profile"><label>表示名 <input name="displayName" required maxlength="64"></label><label>アイコン <input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label><button class="btn">保存</button></form><h2>パスワード変更</h2><form id="password"><label>現在のパスワード <input name="currentPassword" type="password" required></label><label>新しいパスワード <input name="newPassword" type="password" minlength="8" required></label><button class="btn">変更</button></form><p id="settings-status" role="status"></p></section></main></div><script src="/ui/app.js"></script><script type="module" src="/ui/auth.js"></script><script src="/ui/settings.js"></script></body>
