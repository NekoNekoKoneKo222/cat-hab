<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新規登録 | Cat Hub</title><link rel="stylesheet" href="/ui/style.css"></head><body><div class="auth"><section class="auth-art"><div class="eyebrow">JOIN CAT HUB</div><h1>Your hub.<br>Your world.</h1><p class="sub">Firebase Authenticationでアカウントを作成します。</p></section><section class="auth-form"><form class="auth-card" data-register-form><a class="brand" href="/"><span class="brand-mark">C</span><span>Cat Hub</span></a><h2>アカウント作成</h2><p data-auth-message aria-live="polite"></p><label for="displayName">表示名</label><input id="displayName" name="displayName" required maxlength="40" autocomplete="name" placeholder="ねこ"><label for="email">メールアドレス</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="neko@example.com"><label for="password">パスワード</label><input id="password" name="password" required minlength="6" type="password" autocomplete="new-password" placeholder="6文字以上"><button class="btn" data-auth-submit>無料で始める</button><p class="sub" style="text-align:center;margin-top:18px">登録済みですか？ <a href="/login.html" style="color:var(--cyan)">ログイン</a></p></form></section></div><script type="module" src="/ui/auth.js"></script></body></html>
