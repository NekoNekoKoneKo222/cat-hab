services:
  - type: web
    name: cat-hab-222
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CLOUD_CAT_URL
        sync: false
      - key: CAT_TUBE_URL
        sync: false
      - key: VM_ISO_URL
        value: /vm/iso/linux.iso
      - key: VM_MAX_ISO_SIZE_MB
        value: "2048"
      - key: VM_MEMORY_MB
        value: "512"
      - key: VM_CPU_COUNT
        value: "1"
      - key: VM_ENABLED
        value: "true"

