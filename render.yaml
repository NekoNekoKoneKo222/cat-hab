services:
  - type: web
    name: cat-hub
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cat-hub-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: ALLOWED_PROXY_HOSTS
        sync: false
      - key: VM_ISO_URL
        value: /vm/iso/linux.iso
      - key: VM_MAX_ISO_SIZE_MB
        value: "2048"
      - key: VM_MEMORY_MB
        value: "512"
      - key: VM_CPU_COUNT
        value: "1"
      - key: VM_ENABLED
        value: "true"

databases:
  - name: cat-hub-db
    plan: free
