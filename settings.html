<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設定 | Cat Hub</title><link rel="stylesheet" href="/ui/style.css"></head><body data-auth="required" data-page="settings"><div class="shell" data-shell><main class="main"><header class="topbar"><div><div class="eyebrow">ACCOUNT</div><h1 class="title">設定</h1><p class="sub">アカウント名、表示名、パスワードを変更します。</p></div><button class="btn ghost mobile" data-menu>メニュー</button></header><p data-settings-status aria-live="polite"></p><section class="grid"><form class="card" data-settings-form="profile"><h2>表示名</h2><input name="displayName" required maxlength="64" aria-label="表示名"><button class="btn">保存</button></form><form class="card" data-settings-form="username"><h2>アカウント名</h2><input name="username" required pattern="[a-zA-Z0-9_]{3,32}" aria-label="アカウント名"><button class="btn">変更</button></form><form class="card" data-settings-form="password"><h2>パスワード</h2><input name="currentPassword" required type="password" placeholder="現在のパスワード" aria-label="現在のパスワード"><input name="newPassword" required type="password" minlength="8" maxlength="128" placeholder="新しいパスワード" aria-label="新しいパスワード"><button class="btn">変更</button></form></section></main></div><script src="/ui/app.js"></script><script src="/ui/settings.js" defer></script><script src="/ui/auth.js" defer></script></body></html>
